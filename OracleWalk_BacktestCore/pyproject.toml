[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-core"
version = "0.1.0"
description = "Slim backtest engine and report exporter extracted from OracleWalk research."
requires-python = ">=3.9"
dependencies = [
  "pandas",
  "numpy",
  "matplotlib",
]

[project.optional-dependencies]
indicators = [
  "pandas-ta-classic>=0.4.47",
]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
backtest-core = "backtest_core.cli:main"
